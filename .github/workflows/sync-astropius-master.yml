name: Fuse master into astropius_master

# Whenever Asclepius master advances, merge those commits into astropius_master
# so the Astropius preview branch stays current. Never pushes to master.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-astropius-master
  cancel-in-progress: false

jobs:
  fuse-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout astropius_master
        uses: actions/checkout@v4
        with:
          ref: astropius_master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch master and fuse
        run: |
          set -euo pipefail
          git fetch origin master
          BEFORE=$(git rev-parse HEAD)
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "astropius_master already contains origin/master — nothing to fuse."
            echo "FUSED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git merge --no-ff origin/master -m "fuse: merge origin/master into astropius_master"; then
            echo "::error::Merge conflict while fusing master into astropius_master. Resolve on a PR from master → astropius_master."
            git merge --abort || true
            exit 1
          fi
          AFTER=$(git rev-parse HEAD)
          echo "Fused master into astropius_master ($BEFORE → $AFTER)."
          echo "FUSED=1" >> "$GITHUB_ENV"

      - name: Push astropius_master
        if: env.FUSED == '1'
        run: git push origin HEAD:astropius_master
